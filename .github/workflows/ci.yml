# CI del frontend: en cada push o PR instala dependencias, corre los tests unitarios
# (Vitest) y compila la SPA. El despliegue lo sigue haciendo Vercel.
name: CI frontend

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  test-y-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios (Vitest)
        run: npm test

      - name: Compilar (tsc + vite build)
        run: npm run build
        env:
          VITE_USE_MOCKS: 'true'

      - name: Guardar la compilacion
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
