# Wrapper de PR: toda la ejecucion CI/QA/DevSecOps vive en devsecops-templates y la seleccion
# de controles (por evento, rama y tecnologia) en github-actions/analysis-validator.
name: Pull Request Security Review
run-name: CI | ${{ github.event.pull_request.head.ref || github.ref_name }} -> ${{ github.base_ref || github.ref_name }}
'on':
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: Security Analysis
    uses: Taller-SW-Web/devsecops-templates/.github/workflows/workflow-pr-analysis.yml@main
    with:
      component_name: g4-retail-frontend
      technology: node
      language: typescript
      sonar_host_url: ${{ vars.SONAR_HOST_URL }}
      e2e_script: e2e/venta.cjs
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
