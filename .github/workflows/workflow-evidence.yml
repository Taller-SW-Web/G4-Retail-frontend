name: Evidencias Frontend S14
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    name: Pruebas, build y auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Pruebas con reporte JUnit
        run: npm run test:ci
      - name: Compilación de producción
        run: npm run build
      - name: Publicar evidencia incluso ante fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-s14-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
  e2e:
    needs: pruebas
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
    uses: ./.github/workflows/workflow-e2e.yml
  evidence-gate:
    needs: [pruebas, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXTENDED: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
        with:
          script: |
            const n = JSON.parse(process.env.RESULTS);
            if (n.pruebas.result !== 'success' || (process.env.EXTENDED === 'true' && n.e2e.result !== 'success'))
              core.setFailed('Pruebas obligatorias incompletas.');
